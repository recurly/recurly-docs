    put:
      summary: Update Subscription
      description: >-
        Request an update to a subscription that takes place immediately or at
        renewal.


        ##### TIMEFRAME

        The timeframe parameter controls when the upgrade or downgrade takes
        place. The subscription change can occur now or when the subscription
        renews. Generally, if you're performing an upgrade, you will want the
        change to occur immediately (now). If you're performing a downgrade, you
        should set the timeframe to "renewal" so the change takes affect at the
        end of the current billing cycle.


        ###### Updating Refunded Subscriptions

        <div class="alert alert--danger" markdown="1">

        Recurly does not reconcile invoice payments with subscription requests.
        If a subscription has a refund in the current billing cycle, updates
        with a timeframe of "now" will always credit the customer as if the
        refund never existed. Updates with a timeframe of "renewal" will not
        have this problem. <a
        href="https://docs.recurly.com/invoices#subscription_changes">Learn
        more.</a>

        </div>


        ##### ADD-ONS

        The original subscription's add-ons will be removed unless they are
        specified in your update subscription request. Please specify all the
        add-ons that should be present after the subscription change.


        ###### Updating Canceled Subscriptions

        <div class="alert alert--warning" markdown="1">

        If you need to update a canceled subscription, you need to first
        reactivate the subscription and then do the update call. You can look
        for the canceled subscription state to know if you need to do the
        reactivate call first.

        </div>


        ##### COUPONS

        You can redeem a coupon in a subscription update if the update has a
        timeframe of "now" and you change something else about the subscription
        that triggers an invoice, like the plan, quantity, or price.


        The coupon must include the subscription's plan as an eligible charge.


        You can redeem multiple coupons with this format:


        ```

        <coupon_codes>
            <coupon_code>savemore</coupon_code>
            <coupon_code>holidayspecial</coupon_code>
        </coupon_codes>

        ```
      tags:
        - subscriptions
      operationId: updateSubscription
      parameters:
        - in: path
          name: uuid
          schema:
            type: string
          required: true
          description: Uuid.
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              type: object
              properties:
                timeframe:
                  type: string
                  default: now
                  description: >-
                    "now" for immediate, "renewal" to perform when the
                    subscription renews. defaults to "now" if not specified
                plan_code:
                  type: string
                  default: ''
                  description: New plan, remains unchanged if not specified
                quantity:
                  type: integer
                  default: ''
                  description: >-
                    New quantity, remains unchanged if not specified and the
                    plan_code remains the same
                unit_amount_in_cents:
                  type: integer
                  default: ''
                  description: New unit amount in cents
                collection_method:
                  type: string
                  default: ''
                  description: >-
                    Optional field to set the collection for an invoice as
                    "automatic" or "manual". The default is "automatic" if it's
                    not set.
                net_terms:
                  type: integer
                  default: ''
                  description: >-
                    Integer representing the number of days after an invoice's
                    creation that the invoice will become past due. If an
                    invoice's net terms are set to '0', it is due 'On Receipt'
                    and will become past due 24 hours after it’s created. If an
                    invoice is due net 30, it will become past due at 31 days
                    exactly.
                po_number:
                  type: string
                  default: ''
                  description: Optional notes field. Attach a PO number to the invoice.
                subscription_add_ons:
                  type: array
                  default: ''
                  description: >-
                    Nested add-on information for the subscription, the new
                    subscription will have no add-ons unless specified
                coupon_code:
                  type: string
                  default: ''
                  description: >-
                    The coupon code you want to redeem in the update. Only
                    allowed if timeframe is "now" and you change something about
                    the subscription that creates an invoice.
      responses:
        '200':
          description: ''
          content:
            application/xml:
              example: >-
                <subscription
                href="https://your-subdomain.recurly.com/v2/subscriptions/44f83d7cba354d5b84812419f923ea96">
                  <account href="https://your-subdomain.recurly.com/v2/accounts/1"/>
                  <invoice href="https://your-subdomain.recurly.com/v2/invoices/1108"/>
                  <plan href="https://your-subdomain.recurly.com/v2/plans/gold">
                    <plan_code>gold</plan_code>
                    <name>Gold plan</name>
                  </plan>
                  <uuid>44f83d7cba354d5b84812419f923ea96</uuid>
                  <state>active</state>
                  <unit_amount_in_cents type="integer">800</unit_amount_in_cents>
                  <currency>EUR</currency>
                  <quantity type="integer">1</quantity>
                  <activated_at type="datetime">2011-05-27T07:00:00Z</activated_at>
                  <canceled_at nil="nil"></canceled_at>
                  <expires_at nil="nil"></expires_at>
                  <current_period_started_at type="datetime">2011-06-27T07:00:00Z</current_period_started_at>
                  <current_period_ends_at type="datetime">2010-07-27T07:00:00Z</current_period_ends_at>
                  <tax_in_cents type="integer">80</tax_in_cents>
                  <tax_type>usst</tax_type>
                  <tax_region>CA</tax_region>
                  <tax_rate type="float">0.0875</tax_rate>
