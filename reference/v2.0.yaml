            transactions = Transaction.all()
            while transactions:
                for transaction in transactions:
                    print 'Transaction: %s' % transaction
                try:
                    transactions = transactions.next_page()
                except PageError:
                    transactions = ()
        - lang: Dotnet
          source: "using System.Linq;\n\nvar transactions = Transactions.List();\nwhile (transactions.Any())\n{\n\tforeach (var transaction in transactions)\n\t\tConsole.WriteLine(\"Transaction: \" + transaction);\n\ttransactions = transactions.Next;\n}\n\n// Filter successful Transactions\nvar transactions = Transactions.List(TransactionList.TransactionState.Success);\n\n// Filter failed purchases\nvar transactions = Transactions.List(TransactionList.TransactionState.Success,\n                                     TransactionList.TransactionType.Failed);"
    post:
      summary: Create Transaction
      description: "The Recurly API provides a shortcut for creating an invoice, charge, and optionally account, and processing the payment immediately. When creating an account all of the required account attributes must be supplied. When charging an existing account only the account_code must be supplied.\n\n##### Using stored billing info\nYou may create a transaction without specifying billing information if an account already has stored billing information.\n<div class=\"codewrap\" markdown=\"1\">\n<div class=\"codetabs\">\n<p class=\"codetab codetab--xml\" data-tab=\"xml\">xml</p>\n<p class=\"codetab codetab--php\" data-tab=\"php\">PHP</p>\n<p class=\"codetab codetab--ruby\" data-tab=\"ruby\">Ruby</p>\n<p class=\"codetab codetab--python\" data-tab=\"python\">Python</p>\n<p class=\"codetab codetab--csharp\" data-tab=\"csharp\">Dotnet</p>\n</div>\n\n<div class=\"codelanguage codelanguage--xml\" markdown=\"1\">\n\n```xml\n<transaction>\n  <amount_in_cents>100</amount_in_cents>\n  <currency>USD</currency>\n  <account>\n    <account_code>1</account_code>\n  </account>\n</transaction>\n```\n\n</div><div class=\"codelanguage codelanguage--php\" markdown=\"1\">\n\n```php\n$transaction = new Recurly_Transaction();\n$transaction->amount_in_cents = 100; // $1.00\n$transaction->currency = 'USD';\n\n$transaction->account = new Recurly_Account();\n$transaction->account->account_code = '1';\n\n$transaction->create();\n```\n\n</div><div class=\"codelanguage codelanguage--ruby\" markdown=\"1\">\n\n```ruby\ntransaction = account.transactions.create(\n  :amount_in_cents => 1_00,\n  :currency        => 'USD',\n  :account         => { :account_code => '1' }\n)\n```\n\n</div><div class=\"codelanguage codelanguage--python\" markdown=\"1\">\n\n```python\ntransaction = Transaction(\n  amount_in_cents=100,\n  currency='USD',\n  account=Account(account_code='1')\n)\ntransaction.save()\n```\n\n</div><div class=\"codelanguage codelanguage--csharp\" markdown=\"1\">\n\n```csharp\nvar transaction = new Transaction(\"1\", 100, \"USD\"); // account code, unit amount in cents, currency\ntransaction.Create();\n```\n\n</div>\n      </div>\n\n##### Using Existing Billing Info\nAfter a successful transaction, the billing information will be saved with the account for future purchases. If the account already has stored billing info, the billing info from the last transaction will be saved in its place.\n<div class=\"codewrap\" markdown=\"1\">\n<div class=\"codetabs\">\n<p class=\"codetab codetab--xml\" data-tab=\"xml\">xml</p>\n<p class=\"codetab codetab--php\" data-tab=\"php\">PHP</p>\n<p class=\"codetab codetab--ruby\" data-tab=\"ruby\">Ruby</p>\n<p class=\"codetab codetab--python\" data-tab=\"python\">Python</p>\n<p class=\"codetab codetab--csharp\" data-tab=\"csharp\">Dotnet</p>\n</div>\n\n<div class=\"codelanguage codelanguage--xml\" markdown=\"1\">\n\n```xml\nAccept: application/xml\nContent-Type: application/xml; charset=utf-8\n\n<transaction>\n  <amount_in_cents>1000</amount_in_cents>\n  <currency>USD</currency>\n  <account>\n    <account_code>1</account_code>\n    <billing_info>\n      <first_name>Verena</first_name>\n      <last_name>Example</last_name>\n      <address1>123 Main St.</address1>\n      <city>San Francisco</city>\n      <zip>94105</zip>\n      <country>US</country>\n      <number>4111-1111-1111-1111</number>\n      <verification_value>123</verification_value>\n      <month>11</month>\n      <year>2015</year>\n    </billing_info>\n  </account>\n</transaction>\n```\n\n</div><div class=\"codelanguage codelanguage--php\" markdown=\"1\">\n\n```php\n$transaction = new Recurly_Transaction();\n$transaction->amount_in_cents = 1000; // $10.00.\n$transaction->currency = 'USD';\n\n$account = new Recurly_Account();\n$account->account_code = '1';\n\n$billing_info = new Recurly_BillingInfo();\n$billing_info->first_name = 'Verena';\n$billing_info->last_name = 'Example';\n$billing_info->number = '4111-1111-1111-1111';\n$billing_info->verification_value = '123';\n$billing_info->month = 11;\n$billing_info->year = 2015;\n\n$account->billing_info = $billing_info;\n$transaction->account = $account;\n\n$transaction->create();\n```\n\n</div><div class=\"codelanguage codelanguage--ruby\" markdown=\"1\">\n\n```ruby\ntransaction = Recurly::Transaction.create(\n  :amount_in_cents => 10_00,\n  :currency        => 'USD',\n  :account         => {\n    :account_code => '1',\n    :billing_info => {\n      :first_name         => 'Verena',\n      :last_name          => 'Example',\n      :number             => '4111-1111-1111-1111',\n      :verification_value => '123',\n      :month              => 11,\n      :year               => 2015\n    }\n  }\n)\n```\n\n</div><div class=\"codelanguage codelanguage--python\" markdown=\"1\">\n\n```python\ntransaction = Transaction(\n  amount_in_cents=1000,\n  currency='USD',\n  account=Account(\n    account_code=account_code,\n    billing_info=BillingInfo(\n      first_name='Verena',\n      last_name='Example',\n      number='4111-1111-1111-1111',\n      verification_value='123',\n      year=2015',\n      month=11\n    )\n  )\n)\ntransaction.save()\n```\n\n</div><div class=\"codelanguage codelanguage--csharp\" markdown=\"1\">\n\n```csharp\nvar account = Accounts.Get(\"1\");\naccount.BillingInfo = new BillingInfo(account.AccountCode)\n{\n\tFirstName = \"Verana\",\n\tLastName = \"Example\",\n\tCreditCardNumber = \"4111-1111-1111-1111\",\n\tVerificationValue = \"123\",\n\tExpirationYear = 2015,\n\tExpirationMonth = 11\n};\nvar transaction = new Transaction(account, 100, \"USD\");\ntransaction.Create();\n```\n\n</div>\n      </div>"
      tags:
        - transactions
      operationId: createTransaction
      parameters: []
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              type: object
              properties:
                amount_in_cents:
                  type: integer
                  default: ''
                  description: Amount of the transaction in cents. Max 10000000.
                currency:
                  type: string
                  default: ''
                  description: 3-letter currency for the transaction
                account:
                  type: object
                  default: ''
                  description: nested attributes (see below)
                account_code:
                  type: string
                  default: ''
                  description: >-
                    A unique identifier used by your application to identify the
                    account. This code may only contain the following
                    characters: [a-z A-Z 0-9 @ - _ .]. Max of 50 characters.
                description:
                  type: string
                  default: ''
                  description: >-
                    A description for the transaction. Description is added to
                    the invoiced charge, and not the transaction object
                username:
                  type: string
                  default: ''
                  description: Username, ignore if you do not use usernames
                email:
                  type: string
                  default: ''
                  description: Email address
                first_name:
                  type: string
                  default: ''
                  description: First Name. Max 50 characters.
                last_name:
                  type: string
                  default: ''
                  description: Last Name. Max 50 characters.
                company_name:
                  type: string
                  default: ''
                  description: Company name. Max of 50 characters.
                accept_language:
                  type: string
                  default: ''
                  description: >-
                    An ISO 639-1 language code from the user's browser,
                    indicating their preferred language and locale.
                billing_info:
                  type: object
                  default: ''
                  description: account->billing_info nested attributes (see below)
                company:
                  type: string
                  default: ''
                  description: Company name. Max of 50 characters.
                address1:
                  type: string
                  default: ''
                  description: >-
                    Address line 1, recommended for address validation. Max 50
                    characters.
                address2:
                  type: string
                  default: ''
                  description: Address line 2. Max 50 characters.
                city:
                  type: string
                  default: ''
                  description: City. Max 50 characters. Strongly Recommended
                state:
                  type: string
                  default: ''
                  description: State or Province, 2-letters preferred
                country:
                  type: string
                  default: ''
                  description: Country, 2-letter ISO code. Strongly Recommended
                zip:
                  type: string
                  default: ''
                  description: >-
                    Zip or postal code, recommended for address validation.
                    Strongly Recommended
                phone:
                  type: string
                  default: ''
                  description: Phone number
                vat_number:
                  type: string
                  default: ''
                  description: Customer's VAT Number
                ip_address:
                  type: string
                  default: ''
                  description: >-
                    Customer's IP address when updating their billing
                    information. Strongly Recommended.
                number:
                  type: string
                  default: ''
                  description: Credit card number, spaces and dashes are accepted.
                month:
                  type: string
                  default: ''
                  description: Expiration Month
                year:
                  type: string
                  default: ''
                  description: Expiration Year
                verification_value:
                  type: string
                  default: ''
                  description: Security code or CVV, 3-4 digits. Strongly Recommended.
                accounting_code:
                  type: string
                  default: ''
                  description: Accounting code. Max of 20 characters.
                tax_exempt:
                  type: boolean
                  default: 'false'
                  description: >-
                    `true` exempts tax on the charge, `false` applies tax on the
                    charge. If not defined, defaults to `false`.
                tax_code:
                  type: string
                  maxLength: 50
                  title: Tax code
                  description: >-
                    Optional field used by Avalara, Vertex, and Recurly's
                    In-the-Box tax solution to determine taxation rules. You can
                    pass in specific tax codes using any of these tax
                    integrations. For Recurly's In-the-Box tax offering you can
                    also choose to instead use simple values of `unknown`,
                    `physical`, or `digital` tax codes.
