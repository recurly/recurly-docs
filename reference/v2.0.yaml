        - lang: Python
          source: >-
            invoice = Invoice.get('1005')

            line_items = list({'adjustment' : adjustment, 'quantity' : 1,
            'prorate' : False} for adjustment in invoice.line_items)


            refund_invoice = invoice.refund(line_items, 'credit')
        - lang: Dotnet
          source: >-
            // refund a single adjustment

            var invoice = Invoices.Get(1005);

            var adjustment = invoice.Adjustments.First(x => x.Uuid ==
