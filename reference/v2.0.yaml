  /subscriptions:
    get:
      summary: List Subscriptions
      description: >-
        Returns a list of all the subscriptions.


        **Subscription Query States**


        | state | description |

        | --- | --- |

        | active | Subscriptions that are valid for the current time. This
        includes subscriptions in a trial period |

        | canceled | Subscriptions that are valid for the current time but will
        not renew because a cancelation was requested |

        | expired | Subscriptions that have expired and are no longer valid |

        | future | Subscriptions that will start in the future, they are not
        active yet |

        | in_trial | Subscriptions that are active or canceled and are in a
        trial period |

        | live | All subscriptions that are not expired |

        | past_due | Subscriptions that are active or canceled and have a
        past-due invoice |




        <div class="alert alert--warning" markdown="1">

        Please note: a queried state and the base state of a returned
        subscription may differ. For example, querying for past_due
        subscriptions will not result in a list of subscriptions with a
        'past_due' state (they will either be 'active' or 'canceled'). Only base
        states ('pending', 'active', 'canceled', 'expired', 'future') will be
        present in the returned subscription records.

        </div>
            
      tags:
        - subscriptions
      operationId: listSubscriptions
      parameters:
        - in: query
          name: state
          schema:
            type: string
            default: ''
          required: false
          description: >-
            The state of subscriptions to return: "active", "canceled",
            "expired", "future", "in_trial", "live", or "past_due". A
            subscription may belong to more than one state.
        - in: query
          name: cursor
          schema:
            type: string
            default: ''
          required: false
          description: >-
            Splits records across pages. Leave blank to return the first page.
            Follow the URI in the first page's Link header to fetch the next
            page.
        - in: query
          name: per_page
          schema:
            type: string
            default: '50'
          required: false
          description: Number of records to return per page, up to a maximum of 200.
      responses:
        '200':
          description: ''
          content:
            application/xml:
              example: |-
                <subscriptions type="array">
                  <subscription href="https://your-subdomain.recurly.com/v2/subscriptions/44f83d7cba354d5b84812419f923ea96">
                    <account href="https://your-subdomain.recurly.com/v2/accounts/1"/>
                    <invoice href="https://your-subdomain.recurly.com/v2/invoices/1108"/>
                    <plan href="https://your-subdomain.recurly.com/v2/plans/gold">
                      <plan_code>gold</plan_code>
                      <name>Gold plan</name>
                    </plan>
                    <uuid>44f83d7cba354d5b84812419f923ea96</uuid>
                    <state>active</state>
                    <unit_amount_in_cents type="integer">800</unit_amount_in_cents>
                    <currency>EUR</currency>
                    <quantity type="integer">1</quantity>
                    <activated_at type="datetime">2011-05-27T07:00:00Z</activated_at>
                    <canceled_at nil="nil"></canceled_at>
                    <expires_at nil="nil"></expires_at>
                    <current_period_started_at type="datetime">2011-06-27T07:00:00Z</current_period_started_at>
                    <current_period_ends_at type="datetime">2010-07-27T07:00:00Z</current_period_ends_at>
                    <trial_started_at nil="nil"></trial_started_at>
                    <trial_ends_at nil="nil"></trial_ends_at>
                    <tax_in_cents type="integer">72</tax_in_cents>
                    <tax_type>usst</tax_type>
                    <tax_region>CA</tax_region>
                    <tax_rate type="float">0.0875</tax_rate>
                    <po_number nil="nil"></po_number>
                    <net_terms type="integer">0</net_terms>
                    <subscription_add_ons type="array">
