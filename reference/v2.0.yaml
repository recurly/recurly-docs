  /subscriptions/{uuid}/postpone:
    put:
      summary: Postpone Subscription or Extend Trial
      description: >-
        For an active subscription, this will change the next renewal date. For
        a subscription in a trial period, modifying the renewal date will change
        when the trial expires.


        Use this endpoint to:

        * Force a subscription to renew early

        * Keep a subscription from renewing until a later date

        * Shorten a trial period

        * Lengthen a trial period


        ###### Postpone and then Update Subscription

        <div class="alert alert--warning" markdown="1">

        If you postpone and then update a subscription before renewal, we will
        prorate based on the new billing cycle length, not the original length.
        This means you may credit the customer more than expected.


        If you have postponed a subscription and need to make a change to the
        subscription, we recommend making the change for "on renewal".

        </div>
            
      tags:
        - subscriptions
      operationId: postponeSubscriptionOrExtendTrial
      parameters:
