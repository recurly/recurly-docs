    post:
      summary: Create a Charge
      description: >+
        Creates a one-time charge on an account. Charges are not invoiced or
        collected immediately. Non-invoiced charges will automatically be
        invoices when the account's subscription renews, or you trigger a
        collection by posting an invoice. Charges may be removed from an account
        if they have not been invoiced.

      tags:
        - adjustments
      operationId: createACharge
      parameters:
        - in: path
          name: account_code
          schema:
            type: string
            default: ''
          required: true
          description: Your unique account identifier.
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              type: object
              properties:
                currency:
                  type: string
                  default: ''
                  description: Currency, 3-letter ISO code
                unit_amount_in_cents:
                  type: string
                  default: ''
                  description: >-
                    Positive amount for a charge, negative amount for a credit.
                    Max 10000000.
                description:
                  type: string
                  default: ''
                  description: Description of the adjustment for the invoice.
                quantity:
                  type: integer
                  default: '1'
                  description: Quantity
                accounting_code:
                  type: string
                  default: ''
                  description: Accounting code. Max of 20 characters.
                tax_exempt:
                  type: boolean
                  default: ''
                  description: >-
                    `true` exempts tax on the charge, `false` applies tax on the
                    charge. If not defined, then defaults to the Plan and Site
                    settings. This attribute does not work for credits (negative
                    adjustments). Credits are always post-tax. Pre-tax discounts
                    should use the Coupons feature.
                tax_code:
                  type: string
