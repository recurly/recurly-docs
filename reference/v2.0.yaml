openapi: 3.0.0
info:
  title: Recurly V2 API
  description: >-
    # Getting Started

    Welcome to the reference documentation for Recurly's XML API v2. Here you
    will find a complete

    reference for all API v2 operations.


    If you're building a new product, or just getting started with Recurly, we
    recommend

    using our newer [JSON API v3](/developers/api/latest).


    Now let's get started with API v2.

    # Authentication

    ##### API Authentication (HTTP Basic)

    Recurly uses HTTP Basic Authentication—your [Private API
    key](https://app.recurly.com/go/developer/api_access) is securely encrypted
    by the SSL channel.


    If you are testing the API calls via the command line with cURL, try:


    ```

    curl -H 'Accept: application/xml' \
         -H 'X-Api-Version: 2.0' \
         -H 'Content-Type: application/xml; charset=utf-8' \
         -u '[apikey]:' \
        https://[subdomain].recurly.com/v2/accounts
    ```


    Replace `[apikey]` and `[subdomain]` with the appropriate values for your
    site.

    ##### Calculating your own authorization header

    Most programming languages encode the authorization header automatically.
    With HTTP Basic Authentication, the `Authorization` header is a string
    containing a Base-64 encoded username and password. In the case of Recurly’s
    API, you need only specify the username as your API key. If your library
    requires a password, set it to an empty string.


    ```

    "Authorization": "Basic " + base64_encode(API Key)

    ```

    ##### Additional headers

    **Accept Header**


    Recurly API v2 returns results as XML. Your requests should always include
    the header requesting the results as XML:


    ```

    Accept: application/xml

    ```


    **Content-Type Header**


    When sending data to Recurly in a POST or PUT request, your request must
    specify the content type of your request:


    ```

    Content-Type: application/xml; charset=utf-8

    ```


    **X-Api-Version Header**


    When sending data to Recurly, your request should specify the API version
    you're attempting to interact with:

    ```

    X-Api-Version: 2.0

    ```

    You learn more about the different versions in the [API
    Versioning](doc:versioning) section.


    If your XML request is invalid, the API will respond with a status code 400
    Bad Request. This commonly occurs when ampersands are not correctly encoded
    in the text of your request. Please inspect the body of the response for
    more details regarding the error.


    **Private vs. Public**


    A private key is used to authenticate APIs for access to private Recurly
    data.  A public key identifies your site to Recurly servers. Recurly
    provides each site with one public key. This key can be regenerated in the
    same manner as private keys.


    **Private API Keys**


    Recurly supports the use of multiple Private API keys, which can be used to
    integrate third party services using unique, controlled credentials.


    **Limits & Pricing**


    Merchants on the Starter or grandfathered Recurly plans or merchants in
    sandbox mode will be granted 5 private API keys. Merchants on Recurly’s
    Professional plan will be granted 10 private API keys.


    **Default Key**


    Your default private API key should be used to integrate Recurly with your
    backend systems. There will be at least one key active at all times.


    **Additional Keys**


    Additional private API keys should be used to connect your Recurly data to
    additional sources, like analytics software, accounting packages, or email
    tools. Recurly recommends clearly labeling the name of each key to identify
    the associated vendor.


    **Regenerating private API Keys**


    When you generate a private API key, you have two options:

    1. Block the old key immediately. This is primarily recommended when the
    security of a key has been compromised.

    2. Allow the old key access for 12 hours. This is primarily used when
    updating systems and a smooth transition between keys is needed.

    *If a private API key is changed, an email alert will be sent to your
    Recurly Site Technical Contact.*


    **Read-Only Controls**


    When creating a private key, you will have the option to set the key to
    “read-only”. This means the end-user of the API key may make GET requests
    but cannot use PUT or POST requests.
       # API Versioning
    Recurly strives to provide developers with stable APIs to integrate against
    while still being able to provide new and expanded functionality. To balance
    these two goals we provide different API versions and only add new features
    to the latest version of the API. This allows you to choose the best time to
    update your integration and take advantage of new features.


    Recurly offers the following API versions:
    [2.5](https://recurly.com/developers/api-v2/v2.5),
    [2.4](https://recurly.com/developers/api-v2/v2.4),
    [2.3](https://recurly.com/developers/api-v2/v2.3),
    [2.2](https://recurly.com/developers/api-v2/v2.2),
    [2.1](https://recurly.com/developers/api-v2/v2.1),
    [2.0](https://recurly.com/developers/api-v2/v2.0).


    **Requesting A Version**



    ###### API Version Deprecation

    <div class="alert alert--warning" markdown="1">

    As a matter of policy, API versions will remain supported by Recurly for 2
    years after they are released. After this time period, the API versions will
    be deprecated and no longer supported, but will still function.


    API versions 2.0, 2.1, 2.2, 2.3, 2.4, 2.5, and 2.6 will be deprecated on May
    1, 2019. Once deprecated, Recurly will no longer support these versions and
    any associated client libraries, but calls to these versions will function
    normally. You should expect that updates may include changes to product
    usability and integrations, so we recommend starting the update process as
    soon as possible.


    API versions 2.0-2.6 will reach their end of life on November 1, 2019. On
    and after this date, these API versions will no longer function.


    We will be happy to assist you in upgrading to the current API version.
    Please reach out to us at support@recurly.com if you have any questions with
    this documentation.

    </div>
       When making requests to Recurly, your request should specify the desired API version using the `X-Api-Version` header:
    ```

    X-Api-Version: 2.0

    ```

    For backwards compatibility, if no version is specified the default is 2.0.


    **Deprecation**



    To signal that an API version is deprecated and will be removed in the
    future, Recurly will respond the following headers:

    ```

    Recurly-Deprecated: TRUE

    Recurly-Sunset-Date: 2018-06-01T00:00:00+00:00

    ```

    The sunset date is an ISO 8601 date time when the version will no longer be
    accessible.


    Your integration should check for those headers so you can make updates in a
    timely fashion.


    **Changes**



    A complete list of changes for all versions is available on the [API Release
    Notes](https://recurly.com/developers/pages/api-v2/release-notes.html) page.
       # HTTP Status Codes
    **SUCCESSFUL STATUS CODES (2XX)**


    `200 OK`

    The request was successful.

    `201 Created`

    The resource was successfully created. Confirms a success when creating a
    new account, credit, subscription, etc.

    `204 No Content`

    The request was successful and there is no response body.


    **CLIENT ERROR STATUS CODES (4XX)**


    `400 Bad Request`

    The request was invalid or could not be understood by the server.
    Resubmitting the request will likely result in the same error.

    `401 Unauthorized`

    Your API key is missing or invalid.

    `402 Payment Required`

    Your Recurly account is in production mode but is not in good standing.
    Please pay any outstanding invoices.

    `403 Forbidden`

    The login is attempting to perform an action it does not have privileges to
    access. Verify your login credentials are for the appropriate account.

    `404 Not Found`

    The resource was not found with the given identifier. The response body will
    explain which resource was not found.

    `405 Method Not Allowed`

    The requested method is not valid at the given URL.

    `406 Not Acceptable`

    The request's Accept header is not set to application/xml.

    `412 Precondition Failed`

    The request was unsuccessful because a condition was not met. For example,
    this message may be returned if you attempt to cancel a subscription for an
    account that has no subscription.

    `422 Unprocessable Entity`

    Could not process a POST or PUT request because the request is invalid. See
    the response body for more details.

    `429 Too many Requests`

    You have made too many API requests in the last hour. Future API requests
    will be ignored until the beginning of the next hour.


    **SERVER ERROR STATUS CODES (5XX)**


    `500 Internal Server Error`

    The server encountered an error while processing your request and failed.

    `502 Gateway Error`

    The load balancer or web server has trouble connecting to the Recurly app.
    Please try the request again.

    `503 Service Unavailable`

    The service is temporarily unavailable. Please try the request again.


    **FUTURE COMPATIBILITY**


    For future compatibility, please interpret the following status code ranges:


    **200–299** as success,

    **400–499** as client request errors,

    **500–599** as server errors


    ##### 404 Not found responses

    When a lookup, update, or delete request is requested on an object that does
    not exist, the server returns `404 Not Found`:


    ```

    Status: 404 Not Found

    Content-Type: application/xml; charset=utf-8

    ```


    ```

    <?xml version="1.0" encoding="UTF-8"?>

    <error>
      <symbol>not_found</symbol>
      <description>The record could not be located.</description>
    </error>

    ```
       # Pagination
    ##### Number of Records

    Endpoints that return a list of resources will include a header indicating
    the total number of records available. This is specified with the
    `X-Records` header. E.g., for an endpoint with 14 records:


    ```

    X-Records: 14

    ```

    ##### Next

    The amount of records returns within a single API request defaults to 50. It
    may be changed to a maximum of 200 using a `per_page` query parameter, e.g.
    to return 200 accounts at a time:


    ```

    https://your-subdomain.recurly.com/v2/accounts?per_page=200

    ```


    When there are more records remaining than fit in the current response, the
    `Link` header is specified with the URI to the next page of results.


    ```

    Status: 200 OK

    X-Records: 204

    Link: <https://your-subdomain.recurly.com/v2/accounts?cursor=1304958672>;
    rel="next"

    ETag: "a4b0568a2278bc591ceb64b31547eb78"

    ```

    ##### Cursors

    The cursor parameter is a time-based pointer indicating where to resume the
    results. By using a cursor instead of page numbers, the API avoids returning
    duplicate records in the case where additional resources are added between
    pagination requests.

    ##### Previous Pages

    After paginating beyond the first page of results, the Link header will
    include a link to return to the first page of results (`rel="start"`) and
    the previous page (`rel="prev"`):


    ```

    Status: 200 OK

    X-Records: 204

    Link: <https://your-subdomain.recurly.com/v2/transactions>; rel="start",

    <https://your-subdomain.recurly.com/v2/transactions?cursor=-1318344434>;
    rel="prev",

    <https://your-subdomain.recurly.com/v2/transactions?cursor=1318388868>;
    rel="next"

    ETag: "c7431fcfc386fd59ee6c3c2e9ac2a30c"

    ```

    <div class="codewrap" markdown="1">

    <div class="codetabs">

    <p class="codetab codetab--php" data-tab="php">PHP</p>

    <p class="codetab codetab--ruby" data-tab="ruby">Ruby</p>

    <p class="codetab codetab--python" data-tab="python">Python</p>

    </div>


    <div class="codelanguage codelanguage--php" markdown="1">


    ```php

    <?php

    // When accessing a sub resource with a many-to-one relation

    // to the parent model, the attribute returns a Recurly_Stub.

    // For example, take Account -> Invoices


    $account = Recurly_Account::get('my_account_code');


    // Calling ->invoices returns a Stub which allows lazily loading the list

    $invoices = $account->invoices;


    print $invoices;

    // => <Recurly_Stub[invoices]
    href=https://api.recurly.com/v2/accounts/my_account_code/invoices>


    /**
     * Prior to 2.5.0 calling ->get() would only return the first page
     * of results. With 2.5.0 and later, all results will be returned.
     */
    foreach ($invoices->get() as $inv) {
       print $inv->invoice_number . "\n";
    }


    /**
     * Creating a List object directly will also allow you to iterate
     * through all pages
     */
    $invoices = Recurly_InvoiceList::getForAccount('my_account_code');


    // Prints all invoices on the account

    foreach ($invoices as $inv) {
       print $inv->invoice_number . "\n";
    }


    ```


    </div><div class="codelanguage codelanguage--ruby" markdown="1">


    ```ruby

    # When accessing a sub resource with a many-to-one relation# to the parent
    model, the attribute returns a Recurly::Resource::Pager.# For example, take
    Account -> Invoices


    account = Recurly::Account.find('my_account_code')


    puts account.invoices.class

    #=> Recurly::Resource::Pager


    # Pager#each can be used to iterate through the only the given page

    account.invoices.each do |invoice|
      puts invoice.invoice_number
    end


    # The default page size is 50 items, if you wish to page through more

    # you can use Pager#find_each, find_each continues to fetch pages until

    # there are none left

    account.invoices.find_each do |invoice|
      puts invoice.invoice_number
    end


    # You can also create a Pager directly from a resource

    puts Recurly::Invoice.paginate.class

    #=> Recurly::Resource::Pager


    # paginate takes options

    Recurly::Invoice.paginate(per_page: 10).each do |invoice|
      puts invoice.invoice_number
    end


    # You can also use #find_each directly on the resource

    Recurly::Invoice.find_each(per_page: 10).each do |invoice|
      puts invoice.invoice_number
    end


    ```


    </div><div class="codelanguage codelanguage--python" markdown="1">


    ```python

    # When accessing a sub resource with a many-to-one relation

    # to the parent model, the attribute returns a `relatiator` function.

    # When called it returns a recurly.resource.Page.

    # For example, take Account -> Invoices


    account = recurly.Account.get('tester')


    print account.invoices

    # => <function relatitator at 0x1023628c0>


    print account.invoices().__class__

    # => <class 'recurly.resource.Page'>


    # To page through every invoice on the account

    for invoice in account.invoices():
        print invoice.invoice_number

    # You can also call the all() method on

    # a resource to page through every resource

    # on your site. For instance, to page through

    # every invoice:

    for invoice in recurly.Invoice.all():
        print invoice.invoice_number
    ```


    </div>
          </div>


    ###### PHP Pagination

    <div class="alert alert--warning" markdown="1">

    The PHP `Recurly_Pager` class sets up an iterator. It does not provide
    pagination functionality by default.

    </div>
          # Rate Limits
    In order to provide a fast response time to all our customers, we may rate
    limit excessive requests. By default, new Recurly sites have the following
    API rate limits:


    * Sandbox sites: 400 requests/min. All requests count towards the rate
    limit.

    * Production sites: 1,000 requests/min. Only GET requests count towards the
    rate limit.


    Once your site moves into production mode, Recurly will only rate limit GET
    requests. New subscriptions, account modifications, and other requests using
    POST, PUT, or DELETE methods will not count against your rate limit.


    The rate limit is calculated over a sliding 5 minute window. This means a
    production site could make 4,000 requests within one minute and not hit the
    rate limit so long as the site made less than 1,000 requests during the
    prior 4 minutes.


    If an API request exceeds the rate limit, the API returns a 429 status code
    indicating `Too Many Requests`. If your business needs a higher limit,
    please contact support.

    ##### HTTP Headers

    Every authenticated API request returns headers with your current rate limit
    information. Your requests’ rate limit headers may look like:


    ```

    X-RateLimit-Limit: 5000

    X-RateLimit-Remaining: 4999

    X-RateLimit-Reset: 1414622019

    ```


    The `X-RateLimit-Limit` is your total request limit during the 5 minute
    window (e.g. requests/min * 5 min). The `X-RateLimit-Remaining` indicates
    the number of requests remaining until your requests will be denied.
    Finally, the `X-RateLimit-Reset` header contains a timestamp for when the
    current window will completely reset assuming no further API requests are
    made.
       # API Validation Errors
    If the requested create, update, or delete cannot be performed due to
    validation errors, the server returns a `422 Unprocessable Entity` response
    with an array of the validation errors:


    ```

    Status: 422 Unprocessable Entity

    Content-Type: application/xml; charset=utf-8

    ```


    ```

    <?xml version="1.0" encoding="UTF-8"?>

    <errors>
      <error field="model_name.field_name" symbol="not_a_number" lang="en-US">is not a number</error>
    </errors>

    ```
        
  version: '2.0'
tags:
  - name: accounts
    x-displayName: Accounts
  - name: adjustments
    x-displayName: Adjustments
  - name: billing-info
    x-displayName: Billing Info
  - name: coupons
    x-displayName: Coupons
  - name: coupon-redemptions
    x-displayName: Coupon Redemptions
  - name: invoices
    x-displayName: Invoices
  - name: plans
    x-displayName: Plans
  - name: plan-add-ons
    x-displayName: Plan add-ons
  - name: subscriptions
    x-displayName: Subscriptions
  - name: transactions
    x-displayName: Transactions
security:
  - api_key: []
paths:
  /accounts:
    get:
      summary: List Accounts
      description: >-
        Returns a list of accounts on your site. Results are ordered by the time
        created, sorted by newest first.


        **Account Query States**


        | state | description |

        | --- | --- |

        | active | Open accounts. |

        | closed | Accounts that are not open. |

        | subscriber | Accounts with subscriptions that are valid for the
        current time. This includes subscriptions in a trial period. |

        | non_subscriber | Accounts without subscriptions that are valid for the
        current time. |

        | past_due | Accounts with invoices that have failed initial collection
        but still have collection attempts remaining. |




        <div class="alert alert--warning" markdown="1">

        Please note: a queried state and the base state of a returned account
        may differ. For example, querying for past_due account will not result
        in a list of accounts with a 'past_due' state (they will either be
        'active' or 'closed'). Only base states ('active','closed') will be
        present in the returned account records.

        </div>
            
      tags:
        - accounts
      operationId: listAccounts
      parameters:
        - in: query
          name: state
          schema:
            type: string
            default: ''
          required: false
          description: >-
            The state of accounts to return: "active", "closed", "subscriber",
            "non_subscriber", "past_due".
        - in: query
          name: cursor
          schema:
            type: integer
            default: ''
          required: false
          description: >-
            Splits records across pages. Leave blank to return the first page.
            Follow the URI in the first page's Link header to fetch the next
            page.
        - in: query
          name: per_page
          schema:
            type: integer
            default: '50'
          required: false
          description: Number of records to return per page, up to a maximum of 200.
      responses:
        '200':
          description: ''
          content:
            application/xml:
              example: |-
                <accounts type="array">
                  <account href="https://your-subdomain.recurly.com/v2/accounts/1">
                    <adjustments href="https://your-subdomain.recurly.com/v2/accounts/1/adjustments"/>
                    <billing_info href="https://your-subdomain.recurly.com/v2/accounts/1/billing_info"/>
                    <invoices href="https://your-subdomain.recurly.com/v2/accounts/1/invoices"/>
                    <redemption href="https://your-subdomain.recurly.com/v2/accounts/1/redemption"/>
                    <subscriptions href="https://your-subdomain.recurly.com/v2/accounts/1/subscriptions"/>
                    <transactions href="https://your-subdomain.recurly.com/v2/accounts/1/transactions"/>
                    <account_code>1</account_code>
                    <state>active</state>
                    <username nil="nil"></username>
                    <email>verena@example.com</email>
                    <first_name>Verena</first_name>
                    <last_name>Example</last_name>
                    <company_name></company_name>
                    <vat_number nil="nil"></vat_number>
                    <tax_exempt type="boolean">false</tax_exempt>
                    <cc_emails>cc1@example.com,cc2@example.com</cc_emails>
                    <address>
                      <address1>123 Main St.</address1>
                      <address2 nil="nil"></address2>
                      <city>San Francisco</city>
                      <state>CA</state>
                      <zip>94105</zip>
                      <country>US</country>
                      <phone nil="nil"></phone>
                    </address>
                    <accept_language nil="nil"></accept_language>
                    <hosted_login_token>a92468579e9c4231a6c0031c4716c01d</hosted_login_token>
                    <created_at type="datetime">2015-08-25T12:00:00Z</created_at>
                  </account>
                  <!-- Continued... -->
                </accounts>
      x-codeSamples:
        - lang: PHP
          source: |-
            <?php
            $accounts = Recurly_AccountList::getActive();
            foreach ($accounts as $account) {
              print "Account: $account\n";
            }
            ?>
        - lang: Ruby
          source: |-
            Recurly::Account.find_each do |account|
              puts "Account: #{account.inspect}"
            end
        - lang: Python
          source: |-
            #client version <= 2.1.5
            accounts = Account.all()
            while accounts:
                for account in accounts:
                    print 'Account: %s' % account
                try:
                    accounts = accounts.next_page()
                except PageError:
                    accounts = ()

            #client version 2.1.6+
            for account in Account.all():
                print 'Account: %s' % account
        - lang: Dotnet
          source: "using System.Linq;\n\nvar accounts = Accounts.List();\nwhile (accounts.Any())\n{\n\tforeach (var account in accounts)\n\t\tConsole.WriteLine(account);\n\taccounts = accounts.Next;\n}"
    post:
      summary: Create an Account
      description: |+
        Creates a new account. You may optionally include billing information.

      tags:
        - accounts
      operationId: createAnAccount
      parameters: []
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              type: object
              properties:
                account_code:
                  type: string
                  default: ''
                  description: >-
                    A unique identifier used by your application to identify the
                    account. This code may only contain the following
                    characters: [a-z 0-9 @ - _ .] but it may not begin with a
                    dot character. Max of 50 characters
                username:
                  type: string
                  default: ''
                  description: >-
                    The username for the account, ignore if you do not use
                    usernames. Max of 255 characters
                email:
                  type: string
                  default: ''
                  description: The email address for the account
                first_name:
                  type: string
                  default: ''
                  description: The first name for the account. Max of 255 characters
                last_name:
                  type: string
                  default: ''
                  description: The last name for the account.  Max of 255 characters
                company_name:
                  type: string
                  default: ''
                  description: The company name for the account. Max of 50 characters
                vat_number:
                  type: string
                  default: ''
                  description: >-
                    The VAT number to avoid having the VAT applied (if
                    applicable)
                tax_exempt:
                  type: boolean
                  default: ''
                  description: The tax status for the account
                entity_use_code:
                  type: string
                  default: ''
                  description: >-
                    The Avalara AvaTax value that can be passed to identify the
                    customer type for tax purposes. The range of values can be A
                    - R (more info at Avalara). Value is case-sensitive
                billing_info:
                  type: object
                  default: ''
                  description: >-
                    The nested billing information. If present, the account will
                    only be created after the billing information is validated
                address:
                  type: object
                  default: ''
                  description: >-
                    The nested address information for the account: `address1`,
                    `address2`, `city`, `state`, `zip`, `country`, `phone`
                accept_language:
                  type: string
                  default: ''
                  description: >-
                    The ISO 639-1 language code from the user's browser,
                    indicating their preferred language and locale
                cc_emails:
                  type: string
                  default: ''
                  description: >-
                    Additional email address that should receive account
                    correspondence. These should be separated only by commas.
                    These CC emails will receive all emails that the `email`
                    field also receives.
      responses:
        '201':
          description: ''
          content:
            application/xml:
              example: >-
                <account
                href="https://your-subdomain.recurly.com/v2/accounts/1">
                  <adjustments href="https://your-subdomain.recurly.com/v2/accounts/1/adjustments"/>
                  <billing_info href="https://your-subdomain.recurly.com/v2/accounts/1/billing_info"/>
                  <invoices href="https://your-subdomain.recurly.com/v2/accounts/1/invoices"/>
                  <redemption href="https://your-subdomain.recurly.com/v2/accounts/1/redemption"/>
                  <subscriptions href="https://your-subdomain.recurly.com/v2/accounts/1/subscriptions"/>
                  <transactions href="https://your-subdomain.recurly.com/v2/accounts/1/transactions"/>
                  <account_code>1</account_code>
                  <state>active</state>
                  <username nil="nil"></username>
                  <email>verena@example.com</email>
                  <first_name>Verena</first_name>
                  <last_name>Example</last_name>
                  <company_name></company_name>
                  <vat_number nil="nil"></vat_number>
                  <tax_exempt type="boolean">false</tax_exempt>
                  <cc_emails>cc1@example.com,cc2@example.com</cc_emails>
                  <address>
                    <address1>123 Main St.</address1>
                    <address2 nil="nil"></address2>
