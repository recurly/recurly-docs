  /coupons/{coupon_code}/generate:
    post:
      summary: Generate Unique Codes
      description: >-
        Create unique codes for a bulk coupon. A bulk coupon can have up to
        100,000 unique codes total. The generate endpoint allows up to 200
        unique codes at a time. The endpoint can be called multiple times to
        create then number of unique codes you need.


        ##### View Unique Codes

        The response will include the location of the unique codes as link in
        the header:


        ```

        https://your-subdomain.recurly.com/v2/coupons/savemore/unique_coupon_codes?cursor=1792526747654056328&per_page=200

        ```
      tags:
        - coupons
      operationId: generateUniqueCodes
      parameters:
        - in: path
          name: coupon_code
          schema:
            type: string
          required: true
          description: Coupon Code.
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              type: object
              properties:
                number_of_unique_codes:
                  type: integer
                  default: ''
                  description: >-
                    Number of unique codes you want to generate for the bulk
                    coupon. Must be between 1 and 200.
      responses:
        '400':
          description: ''
          content:
            application/xml:
              example: |-
                <!-- Request Too High -->
                <error>
                    <symbol>number_of_unique_codes</symbol>
                    <description>You are limited to generating 200 at a time</description>
                </error>

                <!-- Request In Progress -->
                <error>
                    <symbol>number_of_unique_codes</symbol>
                    <description>Number of unique codes cannot be generated; unique code creation is in progress, please wait for it to finish and try again</description>
                </error>

                <!-- Max Reached -->
                <error>
                    <symbol>number_of_unique_codes</symbol>
                    <description>Number of unique codes can only generate a total of 100000 codes</description>
                </error>

                <!-- Not Bulk Coupon -->
                <error>
                    <symbol>number_of_unique_codes</symbol>
                    <description>Coupon must be of type bulk to generate unique codes</description>
                </error>
      x-codeSamples:
        - lang: text
          source: "<coupon>\n\t<number_of_unique_codes>200</number_of_unique_codes>\n</coupon>"
  /coupons/{coupon_code}/restore:
    put:
      summary: Restore Coupon
      description: >-
        Make an expired coupon redeemable again. You can change editable fields
        in this call.




        <div class="alert alert--info" markdown="1">

        If you aren't going to change anything in the restore action, include
        the coupon parameter: <coupon/>

        </div>


        ##### Restore Coupon That Reached Redeem By Date

        If your coupon has a redeem by date in the past, you must remove the
        date or change it to a future date, otherwise you will get this error:


        ```

        <errors>
            <error field="coupon.redeem_by_date" symbol="in_past">must be in the future</error>
        </errors>

        ```

        ##### Restore Coupon That Reached Max Redemptions

        If your coupon has reached it's max redemptions, you must remove the max
        redemptions or change it to a greater number. You cannot set max
        redemptions to anything less than the number of redemptions you have. If
        you do not update max redemptions in this case, you will get this error.


        ```

        <errors>
            <error field="coupon.max_redemptions" symbol="too_low">must be greater than 100</error>
        </errors>

        ```

        ##### Restoring Bulk Coupons or Unique Codes

        Restoring a bulk coupon will restore the coupon campaign and all unique
        codes that have not been redeemed or individually expired.


        You can restore an individual unique code if the bulk coupon is active
        by using the unique code's coupon code in the call.
      tags:
        - coupons
      operationId: restoreCoupon
      parameters:
        - in: path
          name: coupon_code
          schema:
            type: string
          required: true
          description: Coupon Code.
      requestBody:
        required: true
        content:
          application/xml:
