      description: |-
        Returns a list of all invoices.

        **INVOICE STATES**

        | State | Description |
        | --- | --- |
        | `open` | Open, pending collection |
        | `collected` | Collection completed successfully |
        | `failed` | Failed to collect |
        | `past_due` | Initial collection failed, still attempting collection |



        <div class="alert alert--warning" markdown="1">
