  /invoices/{invoice_number}/refund:
    post:
      summary: Line Item Refunds/Voids
      description: >-
        Allows specific invoice line items and/or quantities to be refunded and
        generates a refund invoice. Full amount line item refunds of invoices
        with an unsettled transaction will void the transaction and generate a
        void invoice.




        <div class="alert alert--warning" markdown="1">

        An invoice with a processed line item refund cannot accept refunds of an
        open amount.


        This endpoint will not void an ACH bank account transaction. ACH voids
        are only allowed through the UI.

        </div>

        **REFUND ATTRIBUTES**

        | Parameter | Description |

        | --- | --- |

        | `uuid` | Unique adjustment ID.**`required`** |

        | `quantity` | Quantity of the line item to refund.**`required`** |

        | `prorate` | Toggle to prorate the line item to refund. Set as `true`
        or `false`. Only applicable to subscription line items still in the
        current billing cycle. Proration is not allowed on invoices with an
        associated transaction that has not settled, due to the full amount
        needed in order to void the transaction. |

        | `refund_apply_order` | If credit line items exist on the invoice, this
        parameter specifies which refund method to use first. Most relevant in a
        partial refunds, you can chose to refund credit back to the account
        first or a transaction giving money back to the customer first. If not
        specified, the default is credit back to the account. Set as `credit` or
        `transaction`. |
      tags:
        - invoices
      operationId: lineItemRefundsVoids
      parameters:
        - in: path
          name: invoice_number
          schema:
            type: string
          required: true
          description: Invoice Number.
      responses:
        '201':
          description: ''
          content:
