          name: state
          schema:
            type: string
            default: all
          required: false
          description: >-
            The state of invoices to return: "open", "collected", "failed", or
            "past_due".
        - in: query
          name: cursor
          schema:
            type: integer
            default: ''
          required: false
          description: >-
            Splits records across pages. Leave blank to return the first page.
            Follow the URI in the first page's Link header to fetch the next
            page.
        - in: query
          name: per_page
          schema:
            type: integer
            default: '50'
          required: false
          description: Number of records to return per page, up to a maximum of 200.
      responses:
        '200':
          description: ''
