    post:
      summary: Create Charge
      description: >-
        Creates a one-time charge on an account. Charges are not invoiced or
        collected immediately. Non-invoiced charges will automatically be
        invoices when the account's subscription renews, or you trigger a
        collection by posting an invoice. Charges may be removed from an account
        if they have not been invoiced.



        ###### Consider using Purchases

        <div class="alert alert--success" markdown="1">

        Unless you need to separately create adjustments and invoice them later,
        prefer the [Purchases](/docs/create-purchase) instead and invoice them
        immediately, including the collection of a successful transaction for
        any balance.

        </div>
            
      tags:
        - adjustments
      operationId: createCharge
      parameters:
        - in: path
          name: account_code
          schema:
            type: string
            default: ''
          required: true
          description: Your unique account identifier.
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              type: object
              properties:
                currency:
                  type: string
                  default: ''
                  description: Currency, 3-letter ISO code.
                unit_amount_in_cents:
                  type: string
                  default: ''
                  description: >-
                    Positive amount for a charge, negative amount for a credit.
                    Max 10000000.
                quantity:
                  type: integer
                  default: '1'
                  description: Quantity.
                description:
                  type: string
                  default: ''
                  description: Description of the adjustment for the invoice.
                accounting_code:
                  type: string
                  default: ''
                  description: Accounting code. Max of 20 characters.
                revenue_schedule_type:
                  type: string
                  default: ''
                  description: >-
                    Optional field for setting a revenue schedule type. This
                    will determine how revenue for the associated Charge should
                    be recognized. Available schedule types are `never`,
                    `at_range_start`, `at_invoice`, and—if `end_date` is
                    set—`evenly` and `at_range_end`.
                tax_exempt:
                  type: boolean
                  default: ''
                  description: >-
                    `true` exempts tax on the charge, `false` applies tax on the
                    charge. If not defined, then defaults to the Plan and Site
                    settings. This attribute does not work for credits (negative
                    adjustments). Credits are always post-tax. Pre-tax discounts
                    should use the Coupons feature.
                tax_code:
                  type: string
                  maxLength: 50
                  title: Tax code
                  description: >-
                    Optional field used by Avalara, Vertex, and Recurly's
                    In-the-Box tax solution to determine taxation rules. You can
                    pass in specific tax codes using any of these tax
                    integrations. For Recurly's In-the-Box tax offering you can
                    also choose to instead use simple values of `unknown`,
                    `physical`, or `digital` tax codes.
                start_date:
                  type: string
                  format: date-time
                  default: now
                  description: A timestamp associated with when the charge began.
                end_date:
                  type: string
                  format: date-time
                  default: ''
                  description: A timestamp associated with when the charge ended.
                product_code:
                  type: string
                  default: ''
                  description: >-
                    The product code or SKU of the line item. Max of 50
                    characters. Useful for later reporting on product purchases.
      responses:
        '201':
          description: ''
          content:
            application/xml:
              example: >-
