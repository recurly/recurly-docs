    put:
      summary: Update Subscription
      description: >-
        Request an update to a subscription that takes place immediately or at
        renewal.



        ###### Updating Canceled Subscriptions

        <div class="alert alert--danger" markdown="1">

        If you need to update a canceled subscription, you need to first
        reactivate the subscription and then do the update call. You can look
        for the canceled subscription state to know if you need to do the
        reactivate call first.


        While changing a canceled subscription may reactivate the subscription
        in some cases, there are scenarios where it will not reactivate the
        subscription, so we do not recommend allowing changes on a canceled
        subscription.


        If you do submit an at renewal change to a canceled subscription and do
        not reactivate the subscription, it will expire at renewal.

        </div>


        ##### TIMEFRAME

        The timeframe parameter controls when the upgrade or downgrade takes
        place. The subscription change can occur now or when the subscription
        renews. Generally, if you're performing an upgrade, you will want the
        change to occur immediately (now). If you're performing a downgrade, you
        should set the timeframe to "renewal" so the change takes affect at the
        end of the current billing cycle.


        The timeframe control only applies to changes to the subscription's
        products. All non-product changes are always applied immediately. These
        changes have the option of applying at renewal: `plan_code`, `quantity`,
        `unit_amount_in_cents`, `subscription_add_ons`.


        ###### Updating Refunded Subscriptions

        <div class="alert alert--danger" markdown="1">

        Recurly does not reconcile invoice payments with subscription requests.
        If a subscription has a refund in the current billing cycle, updates
        with a timeframe of "now" will always credit the customer as if the
        refund never existed. Updates with a timeframe of "renewal" will not
        have this problem. <a
        href="https://docs.recurly.com/invoices#subscription_changes">Learn
        more.</a>

        </div>


        ##### ADD-ONS

        If you include the `subscription_add_ons` array in your request, the
        subscription's original add-ons will be removed unless they are
        specified in your update subscription request. Please specify all the
        add-ons that should be present after the subscription change. If you do
        not include the `subscription_add_ons` array, your current add-ons will
        remain in the subscription.

        ##### COUPONS

        You can redeem a coupon in a subscription update if the update has a
        timeframe of "now" and you change something else about the subscription
        that triggers an invoice, like the plan, quantity, or price.


        The coupon must include the subscription's plan as an eligible charge.


        You can redeem multiple coupons with this format:


        ```

        <coupon_codes>
            <coupon_code>savemore</coupon_code>
            <coupon_code>holidayspecial</coupon_code>
        </coupon_codes>

        ```
      tags:
        - subscriptions
      operationId: updateSubscription
      parameters:
        - in: path
          name: uuid
          schema:
            type: string
            default: ''
          required: true
          description: Subscription's unique identifier.
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              type: object
              properties:
                timeframe:
                  type: string
                  default: now
                  description: >-
                    `now` for immediate, `renewal` to perform when the
                    subscription renews. Defaults to `now`.
                plan_code:
                  type: string
                  default: ''
                  description: New plan, remains unchanged if not specified
                quantity:
                  type: integer
                  default: ''
                  description: >-
                    New quantity, remains unchanged if not specified and the
                    `plan_code` remains the same.
                unit_amount_in_cents:
                  type: integer
                  default: ''
                  description: New unit amount in cents
                collection_method:
                  type: string
                  default: automatic
                  description: >-
                    Optional field to set the collection for an invoice as
                    `automatic` or `manual`. The default is `automatic`. Will
                    always change immediately, even if `timeframe` = `renewal`.
                net_terms:
                  type: integer
                  default: ''
                  description: >-
                    Integer representing the number of days after an invoice's
                    creation that the invoice will become past due. If an
                    invoice's net terms are set to `0`, it is due 'On Receipt'
                    and will become past due 24 hours after it’s created. If an
                    invoice is due net 30, it will become past due at 31 days
                    exactly. Will always change immediately, even if `timeframe`
                    = `renewal`.
                po_number:
                  type: string
                  default: ''
                  description: >-
                    Optional notes field. Attach a PO number to the invoice.
                    Will always change immediately, even if `timeframe` =
                    `renewal`.
                subscription_add_ons:
                  type: array
                  default: ''
                  description: >-
                    Nested add-on information for the subscription, the new
                    subscription will have no add-ons unless specified
                coupon_code:
                  type: string
                  default: ''
                  description: >-
                    The coupon code you want to redeem in the update. Only
                    allowed if timeframe is `now` and you change something about
                    the subscription that creates an invoice.
                revenue_schedule_type:
                  type: string
                  default: ''
                  description: >-
                    Optional field for setting a revenue schedule type. This
                    will determine how revenue for the associated Subscription
                    should be recognized. When creating a Subscription,
                    available schedule types are `never`, `evenly`,
                    `at_range_start`, or `at_range_end`. If no
                    `revenue_schedule_type` is set, the Subscription will
                    inherit the `revenue_schedule_type` from its Plan.
                remaining_billing_cycles:
                  type: integer
                  default: ''
                  description: >-
                    The number of billing periods that are left in the
                    subscription. `1` means the subscription renew one more time
                    and then expire.  Decrements from the total number of
                    billing periods in the current term. Will always be 0 if
                    total billing cycles is 1.
                imported_trial:
                  type: boolean
                  default: ''
                  description: >-
                    indicates if the subscription is to be treated as an import
                    for data analysis or a real trial. This value can only be
                    changed on a trial subscription and is persisted for its
                    lifetime.
                renewal_billing_cycles:
                  type: integer
                  default: ''
                  description: >-
                    The number of billing periods in the term that the
                    subscription will renew to after current term completes.
                    This change will always take effect immediately, even if
                    `timeframe = renewal`.  `null` means the subscription will
                    not auto-renew.
                auto_renew:
                  type: boolean
                  default: ''
                  description: >-
                    Determines whether subscription will  auto renew for another
                    term at the end of current term.Defaults to plan value
                    unless overwritten when creating subscription or editing
                    subscription.
