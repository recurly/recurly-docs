            default: 'false'
          required: false
          description: >-
            Optional field to be used only when needing to bypass the 60 second
            limit on creating subscriptions. Should only be used when creating
            subscriptions in bulk from the API. Set to `true` or `false`.
            Defaults to `false`.
        - in: path
