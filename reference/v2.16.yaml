            account = Account.get('1')
            transactions = account.transactions()
            while transactions:
                for transaction in transactions:
                    print 'Transaction: %s' % transaction
                try:
                    transactions = transactions.next_page()
                except PageError:
                    transactions = ()
        - lang: Dotnet
          source: "using System.Linq;\n\nvar account = Accounts.Get(\"1\");\nvar transactions = account.GetTransactions();\nwhile (transactions.Any())\n{\n\tforeach (var transaction in transactions)\n\t\tConsole.WriteLine(\"Transaction: \" + transaction);\n\ttransactions = transactions.Next;\n}"
