  /purchases/authorize:
    post:
      summary: Authorize Purchase
      description: >+
        A purchase is a hybrid checkout containing at least one or more
        subscriptions or one-time charges (adjustments) and supports both coupon
        and gift card redemptions. All items purchased will be on one invoice
        and paid for with one transaction. A purchase is only a request data
        type and is not persistent in Recurly and an invoice collection will be
        the returned type.


        The authorize endpoint will create a pending purchase that can be
        activated at a later time once payment has been completed on an external
        source (e.g. Adyen's Hosted Payment Pages).

      tags:
        - purchases
      operationId: authorizePurchase
      parameters: []
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              type: object
              properties:
                account:
                  type: object
                  default: ''
                  description: >-
                    An account object. This can be an existing account or a new
                    account. If using a new account and adding shipping
                    addresses, the last shipping address in the list will apply
                    to every subscription and adjustment in the purchase.
                adjustments:
                  type: array
                  default: ''
                  description: >-
                    This should be a list of Adjustment objects. Required if
                    there are no subscriptions.
                collection_method:
                  type: string
                  default: ''
                  description: >-
                    The collection method for the invoice (`automatic` or
                    `manual`).
                currency:
                  type: string
                  default: ''
                  description: The 3 letter currency code for the adjustments.
                po_number:
                  type: string
                  default: ''
                  description: A po number for the resulting invoice.
                net_terms:
                  type: integer
                  default: ''
                  description: The net terms for the invoice
                gift_card:
                  type: object
                  default: ''
                  description: A gift card with a redemption code to apply to this purchase
                coupon_codes:
                  type: string
                  default: ''
                  description: A list of coupon codes to apply to this purchase
                subscriptions:
                  type: array
                  default: ''
                  description: >-
                    A list of Subscriptions to invoice in this purchase.
                    Required if there are no adjustments.
                customer_notes:
                  type: string
                  default: ''
                  description: >-
                    Optional notes to show customer on the invoice. This will
                    default to the Customer Notes text specified on the Invoice
                    Settings page in your Recurly admin. Custom notes made on an
                    invoice for a one time charge will not carry over to
                    subsequent invoices.
                terms_and_conditions:
                  type: string
                  default: ''
                  description: >-
                    Optional terms and conditions to show customer on the
                    invoice. This will default to the Terms and Conditions text
                    specified on the Invoice Settings page in your Recurly
                    admin. Custom notes will stay with a subscription on all
                    renewals.
                vat_reverse_charge_notes:
                  type: string
                  default: ''
                  description: >-
                    Optional VAT reverse charge notes to show the customer on
                    the invoice. Only appears if you have EU VAT enabled or are
                    using your own Avalara AvaTax account and the customer is in
                    the EU, has a VAT number, and is in a different country than
                    your own. This will default to the VAT Reverse Charge Notes
                    text specified on the Tax Settings page in your Recurly
                    admin, unless custom notes were created with the original
                    subscription. Custom notes will stay with a subscription on
                    all renewals.
                shipping_address_id:
                  type: integer
                  format: int64
                  default: ''
                  description: >-
                    All subscriptions and adjustments on the purchase will use
                    this shipping address unless they specify one of their own.
                    Any subscriptions for which this address might apply will
                    also use it in future renewals unless changed or removed.
                    Cannot be used if a new shipping address is created at the
                    account level.
      responses:
        '200':
          description: ''
          content:
            application/xml:
              example: |-
