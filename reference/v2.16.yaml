  /subscriptions/{uuid}:
    get:
      summary: Lookup Subscription
      description: >-
        Lookup a subscription's details.



        ###### Pending Subscription Changes

        <div class="alert alert--info" markdown="1">

        When looking up a subscription that has pending changes, the new
        subscription details will be in a pending_subscription node. Since
        immediate subscription changes take place immediately, pending
        subscription changes will only show for changes occurring when the
        subscription renews.

        </div>



        ###### Paused Subscriptions and current_term_ends_at timestamp

        <div class="alert alert--info" markdown="1">

        While a subscription is paused, the current_term_ends_at timestamp of
        the subscription will not be updated to account for the time while the
        subscription is paused (e.g the timestamp does not get pushed out by the
        number of paused periods). This is due to the fact that the subscription
        could be resumed earlier or the number of pause periods can frequently
        be updated. Any of the former events could potentially change the
        timestamp. Once a subscription is returned to active, the
        current_term_renewal_date will be updated.


        To calculate the new renewal date while a subscription is paused, you
        will want to take original renewal date add the length of the pause
        period.

        </div>


        | Subscription Parameters | Description |

        | --- | --- |

        | plan | Nested plan_code and plan name |

        | uuid | Unique subscription ID |

        | state | `active`, `canceled`, `future`, `expired`, `paused` |

        | unit_amount_in_cents | Unit amount of the subscription |

        | quantity | Number of units |

        | currency | 3-letter ISO currency for the subscription |

        | activated_at | Date the subscription was activated |

        | canceled_at | Date the subscription was marked canceled |

        | expires_at | Date the subscription will end (if state is `canceled`)
        or ended (if state is `expired`) |

        | auto_renew | True if subscription term set to auto renew at end of
        term |

        | current_period_started_at | Date the current billing period started |

        | current_period_ends_at | Date the current billing period will end |

        | current_term_started_at | Date and time that the current term started
        at. |

        | current_term_ends_at | Date and time that the current term will end
        (or the date and time the term will renew if auto_renew is true) |

        | total_billing_cycles | Total number of billing periods in the current
        term. |

        | remaining_billing_cycles | Remaining number of billing periods in the
        current subscription term. Always set to 0 for subscriptions with a
        single billing period term. |

        | renewal_billing_cycles | Total number of billing periods in the
        subscription's next term, if auto_renew is true |

        | trial_started_at | Date the trial was started, if applicable |

        | trial_ends_at | Date the trial ended, if applicable |

        | tax_in_cents | Amount of tax or VAT within the transaction, in cents.
        |

        | tax_type | Tax type as "vat" for VAT or "usst" for US Sales Tax. |

        | tax_region | Region where taxes are applied. |

        | tax_rate | Tax rate that will be applied to this subscription. |

        | po_number | PO number reference. |

        | net_terms | Invoice net terms in days. |

        | collection_method | Invoice collection as "automatic" or "manual". |

        | subscription_add_ons | Nested list of add-ons on the subscription, if
