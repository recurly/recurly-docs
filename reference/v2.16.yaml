    post:
      summary: 'Post Invoice: Invoice Pending Adjustments on Account'
      description: >-
        When you post one-time charges to an account, these will remain pending
        until they are invoiced. An account is automatically invoiced when the
        subscription renews. However, there are times when it is appropriate to
        invoice an account before the renewal. If the subscriber has a yearly
        subscription, you might want to collect the one-time charges well before
        the renewal.




        <div class="alert alert--warning" markdown="1">

        This API call will return the new invoice's details on success. If there
        are no pending charges, it will return an HTTP status code of `422
        Unprocessable Entity`.

        </div>
            
      tags:
        - invoices
      operationId: postInvoiceInvoicePendingAdjustmentsOnAccount
      parameters:
        - in: path
          name: account_code
          schema:
            type: string
            default: ''
          required: true
          description: Unique account identifier.
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              type: object
              properties:
                terms_and_conditions:
                  type: string
                  default: ''
                  description: >-
                    Optional notes field. This will default to the Terms and
                    Conditions text specified on the Invoice Settings page in
                    your Recurly admin. Specify custom notes with this tag to
                    add or override Terms and Conditions. Custom notes will stay
                    with a subscription on all renewals.
                customer_notes:
                  type: string
                  default: ''
                  description: >-
                    Optional notes field. This will default to the Customer
                    Notes text specified on the Invoice Settings page in your
                    Recurly admin. Specify custom notes with this tag to add
                    Customer Notes. Custom notes made on an invoice for a one
                    time charge will not carry over to subsequent invoices.
                vat_reverse_charge_notes:
                  type: string
                  default: ''
                  description: >-
                    VAT Reverse Charge Notes only appear if you have EU VAT
                    enabled or are using your own Avalara AvaTax account and the
                    customer is in the EU, has a VAT number, and is in a
                    different country than your own. This will default to the
                    VAT Reverse Charge Notes text specified on the Tax Settings
                    page in your Recurly admin, unless custom notes were created
                    with the original subscription. Specify custom notes with
                    this tag to add or override VAT Reverse Charge Notes. Custom
                    notes will stay with a subscription on all renewals.
                collection_method:
                  type: string
                  default: automatic
                  description: Can be either `automatic` or `manual`.
                net_terms:
                  type: integer
                  default: ''
                  description: >-
                    Only supported with collection_method of `manual`. Integer
                    representing the number of days after an invoice's creation
                    that the invoice will become past due. If an invoice's net
                    terms are set to '0', it is due 'On Receipt' and will become
                    past due 24 hours after it’s created. If an invoice is due
                    net 30, it will become past due at 31 days exactly.
                po_number:
                  type: string
                  default: ''
                  description: >-
                    Only supported with collection_method of `manual`.  Optional
                    notes field. Attach a PO number to the invoice.
                currency:
                  type: string
                  default: ''
                  description: The currency code for the currency used
      responses:
        '201':
          description: ''
          content:
            application/xml:
              example: |
                <invoice_collection>
                  <charge_invoice href="https://your-subdomain.recurly.com/v2/invoices/1016">
