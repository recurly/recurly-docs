      requestBody:
        required: true
        content:
          application/xml:
            schema:
              type: object
              properties:
                plan_code:
                  type: string
                  default: ''
                  description: >-
                    Unique code to identify the plan. This code may only contain
                    the following characters: [a-z 0-9 @ - _ .]. Max of 50
                    characters.
                name:
                  type: string
                  default: ''
                  description: Plan name. Max of 255 characters.
                unit_amount_in_cents:
                  type: array
                  default: ''
                  description: Array of currency objects, see example below. Max 10000000.
                description:
                  type: string
                  default: ''
                  description: Optional plan description, not displayed.
                trial_interval_unit:
                  type: string
                  default: months
                  description: '`days` or `months`, defaults to `months`.'
                trial_interval_length:
                  type: integer
                  default: '0'
                  description: Defaults to `0`, for no trial
                trial_requires_billing_info:
                  type: boolean
                  default: ''
                  description: >-
                    Allow free trial subscriptions to be created without billing
                    info. Should not be used if billing info is needed for
                    initial invoice due to existing uninvoiced charges or setup
                    fee.
                success_url:
                  type: string
                  default: ''
                  description: URL to redirect to after signup on the hosted payment pages.
                accounting_code:
                  type: string
                  default: ''
                  description: >-
                    Accounting code for related invoice line items, code may
                    only contain the following characters: [a-z 0-9 @ - _ .].
                    Max of 20 characters.
                revenue_schedule_type:
                  type: string
                  default: evenly
                  description: >-
                    Optional field for setting a revenue schedule type. This
                    will determine how revenue for the associated Plan should be
                    recognized. When creating a Plan, available schedule types
                    are `never`, `evenly`, `at_range_start`, or `at_range_end`.
                setup_fee_accounting_code:
                  type: string
                  default: ''
                  description: >-
                    Accounting code for a Setup Fee, code may only contain the
                    following characters: [a-z 0-9 @ - _ .]. Max of 20
                    characters.
                setup_fee_revenue_schedule_type:
                  type: string
                  default: evenly
                  description: >-
                    Optional field for setting a revenue schedule type. This
                    will determine how revenue for the associated Plan Setup Fee
                    should be recognized. When creating a Plan Setup Fee,
                    available schedule types are `never`, `evenly`,
                    `at_range_start`, or `at_range_end`.
                setup_fee_in_cents:
                  type: array
                  default: ''
                  description: Array of currency objects, see examples. Max 10000000.
                total_billing_cycles:
                  type: integer
                  default: ''
                  description: >-
                    Number of billing cycles before the plan stops renewing,
                    defaults to `null` for continuous auto renewal.
                unit_name:
                  type: string
                  default: ''
                  description: '*Deprecated* Unit description for the quantity, e.g. users.'
                display_quantity:
                  type: boolean
                  default: 'false'
                  description: >-
                    Display the quantity field on the hosted payment page if
                    `true`, defaults to `false`.
                cancel_url:
                  type: string
                  default: ''
                  description: >-
                    *Deprecated* URL to redirect to on canceled signup on the
                    hosted payment pages.
                tax_exempt:
                  type: boolean
                  default: ''
                  description: >-
                    `true` exempts tax on the plan, `false` applies tax on the
                    plan. If not defined, then defaults to the Plan and Site
                    settings.
                tax_code:
                  type: string
                  maxLength: 50
                  title: Tax code
                  description: >-
                    Optional field used by Avalara, Vertex, and Recurly's
