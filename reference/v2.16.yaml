openapi: 3.0.0
info:
  title: Recurly V2 API
  description: >-
    # Getting Started

    Welcome to the reference documentation for Recurly's XML API v2. Here you
    will find a complete

    reference for all API v2 operations.


    If you're building a new product, or just getting started with Recurly, we
    recommend

    using our newer [JSON API v3](/developers/api/latest).


    Now let's get started with API v2.

    # Authentication

    ##### API Authentication (HTTP Basic)

    Recurly uses HTTP Basic Authentication—your [Private API
    key](https://app.recurly.com/go/developer/api_access) is securely encrypted
    by the SSL channel.


    If you are testing the API calls via the command line with cURL, try:


    ```

    curl -H 'Accept: application/xml' \
         -H 'X-Api-Version: 2.16' \
         -H 'Content-Type: application/xml; charset=utf-8' \
         -u '[apikey]' \
        https://[subdomain].recurly.com/v2/accounts
    ```


    Replace `[apikey]` and `[subdomain]` with the appropriate values for your
    site.

    ##### Calculating your own authorization header

    Most programming languages encode the authorization header automatically.
    With HTTP Basic Authentication, the `Authorization` header is a string
    containing a Base-64 encoded username and password. In the case of Recurly’s
    API, you need only specify the username as your API key. If your library
    requires a password, set it to an empty string.


    ```

    "Authorization": "Basic " + base64_encode(API Key)

    ```


    ##### Additional Request Headers

    **Accept Header**


    Recurly API v2 returns results as XML. Your requests should always include
    the header requesting the results as XML:


    ```

    Accept: application/xml

    ```


    **Content-Type Header**


    When sending data to Recurly in a POST or PUT request, your request must
    specify the content type of your request:


    ```

    Content-Type: application/xml; charset=utf-8

    ```


    **X-Api-Version Header**


    When sending data to Recurly, your request should specify the API version
    you're attempting to interact with:

    ```

    X-Api-Version: 2.16

    ```

    You learn more about the different versions in the [API
    Versioning](doc:versioning) section.



    ##### Public API Key

    Recurly uses two types of API keys: public and private. The Public API key
    is used by [Recurly.js](doc:recurlyjs) to identify its requests as belonging
    to your Recurly site. This key can be safely included in Javascript code.


    Recurly provides each site with one Public Key. The Public API Key can be
    regenerated on the [API
    Credentials](https://app.recurly.com/go/developer/api_access) page.

    ##### Private API Keys



    ###### Treat your Private API Keys like passwords!

    <div class="alert alert--danger" markdown="1">

    The API key allows access to your site's data. Do not include it in
    Javascript code exposed to browsers.

    </div>
       Recurly supports the use of multiple Private API keys, which can be used to integrate third party services using unique, controlled credentials.

    **Limits & Pricing**


    Merchants on the Starter or grandfathered Recurly plans or merchants in
    sandbox mode will be granted 5 private API keys. Merchants on Recurly’s
    Professional plan will be granted 10 private API keys.


    **Default Key**


    Your default private API key should be used to integrate Recurly with your
    backend systems. There will be at least one key active at all times.


    **Additional Keys**


    Additional private API keys should be used to connect your Recurly data to
    additional sources, like analytics software, accounting packages, or email
    tools. Recurly recommends clearly labeling the name of each key to identify
    the associated vendor.


    **Regenerating Private API Keys**


    Your API key can be regenerated by clicking on the Regenerate button on the
    [API credentials](https://app.recurly.com/go/developer/api_access) page.
    When you generate a private API key, you have two options:


    1. Block the old key immediately. This is primarily recommended when the
    security of a key has been compromised.

    2. Allow the old key access for 12 hours. This is primarily used when
    updating systems and a smooth transition between keys is needed.


    *If a private API key is changed, an email alert will be sent to your
    Recurly Site Technical Contact.*


    **Read-Only Keys**


    When creating a private key, you will have the option to set the key to
    “read-only”. This means the API key may make GET requests but cannot not
    PUT, POST or DELETE requests.
       # API Versioning
    Recurly strives to provide developers with stable APIs to integrate against
    while still being able to provide new and expanded functionality. To balance
    these two goals we provide different API versions and only add new features
    to the latest version of the API. This allows you to choose the best time to
    update your integration and take advantage of new features.


    Recurly offers the following API versions:  
    [2.16](https://recurly.com/developers/api-v2/v2.16),
    [2.15](https://recurly.com/developers/api-v2/v2.15),
    [2.14](https://recurly.com/developers/api-v2/v2.14),
    [2.13](https://recurly.com/developers/api-v2/v2.13),
    [2.12](https://recurly.com/developers/api-v2/v2.12),[2.11](https://recurly.com/developers/api-v2/v2.11),
    [2.10](https://recurly.com/developers/api-v2/v2.10),
    [2.9](https://recurly.com/developers/api-v2/v2.9),
    [2.8](https://recurly.com/developers/api-v2/v2.8), 
    [2.7](https://developers.recurly.com/api-v2/v2.7),
    [2.6](https://recurly.com/developers/api-v2/v2.6),
    [2.5](https://recurly.com/developers/api-v2/v2.5),
    [2.4](https://recurly.com/developers/api-v2/v2.4),
    [2.3](https://recurly.com/developers/api-v2/v2.3),
    [2.2](https://recurly.com/developers/api-v2/v2.2).


    **Requesting A Version**



    ###### API Version Deprecation

    <div class="alert alert--warning" markdown="1">

    As a matter of policy, API versions will remain supported by Recurly for 2
    years after they are released. After this time period, the API versions will
    be deprecated and no longer supported, but will still function.


    API versions 2.0, 2.1, 2.2, 2.3, 2.4, 2.5, and 2.6 will be deprecated on May
    1, 2019. Once deprecated, Recurly will no longer support these versions and
    any associated client libraries, but calls to these versions will function
    normally. You should expect that updates may include changes to product
    usability and integrations, so we recommend starting the update process as
    soon as possible.


    API versions 2.0-2.6 will reach their end of life on November 1, 2019. On
    and after this date, these API versions will no longer function.


    We will be happy to assist you in upgrading to the current API version.
    Please reach out to us at support@recurly.com if you have any questions with
    this documentation.

    </div>
       When making requests to Recurly, your request should specify the desired API version using the `X-Api-Version` header:
    ```

    X-Api-Version: 2.16

    ```

    For backwards compatibility, if no version is specified the default is 2.0.


    **Deprecation**



    To signal that an API version is deprecated and will be removed in the
    future, Recurly will respond the following headers:

    ```

    Recurly-Deprecated: TRUE

    Recurly-Sunset-Date: 2018-06-01T00:00:00+00:00

    ```

    The sunset date is an ISO 8601 date time when the version will no longer be
    accessible.


    Your integration should check for those headers so you can make updates in a
    timely fashion.


    **Changes in v2.16**



    Request and Response changes:


    - Changed `POST v2/purchases` request:
      - Allow `po_number` when collection method is `automatic` and manual invoicing is enabled.
      - Allow `starts_at` to specify a future date when a subscription should start. Previous versions only allowed subscriptions to start immediately via this endpoint.
    - Changed `PUT /v2/accounts/:account_code/billing_info` request:
      - Added support for updating billing info with a gateway code and token. Previous versions only allowed creating a new billing info, not updating existing billing info.
    - Changed `PUT /v2/accounts/:account_code/billing_info` response:
      - Added <gateway_code> and (masked) <gateway_token> to response when updating a billing info with gateway code and token, so it maps to the request that was sent.

    A complete list of changes for all versions is available on the [API Release
    Notes](https://recurly.com/developers/pages/api-v2/release-notes.html) page.
       # Pagination
    ##### Next Link

    The amount of records returned within a single API request defaults to 50.
    It may be changed to a maximum of 200 using a `per_page` query parameter,
    e.g. to return 200 accounts at a time:


    ```

    https://your-subdomain.recurly.com/v2/accounts?per_page=200

    ```


    When there are more records remaining than fit in the current response, the
    `Link` header is specified with the URI to the next page of results.


    ```

    Status: 200 OKLink:
    <https://your-subdomain.recurly.com/v2/accounts?cursor=1972702718353176814%3A1465932489>;
    rel="next"ETag: "a4b0568a2278bc591ceb64b31547eb78"```


    The `cursor` parameter is a time-based pointer indicating where to resume
    the results. By using a cursor instead of page numbers, the API avoids
    returning duplicate records in the case where additional resources are added
    between pagination requests.

    ##### Sorting and Filtering
     Many endpoints support these advanced pagination parameters:

    * `sort` : String: The attribute that will be used to order records:
    `created_at`, `updated_at`. Defaults to `created_at`.

    * `order` : String : The order in which products will be returned: `asc` for
    ascending order, `desc` for descending order. Defaults to `desc`.

    * `begin_time` : Datetime : Operates on the attribute specified by the sort
    parameter. Filters records to only include those with datetimes greater than
    or equal to the supplied datetime. Accepts an ISO 8601 date or date and
    time.

    * `end_time` : Datetime : Operates on the attribute specified by the sort
    parameter. Filters records to only include those with datetimes less than or
    equal to the supplied datetime. Accepts an ISO 8601 date or date and time.


    Review the parameters on each endpoint for more details.


    ###### Updated at really means last updated at

    <div class="alert alert--info" markdown="1">

    An account that was updated on `2016-01-19` and then again on `2016-03-23`
    would not be returned in a request for
    `sort=updated_at&end_time=2016-03-01`.

    </div>
       ##### Counting Records
    Starting with API version 2.6, you must explicitly make a `HEAD` request to
    get the server count. Endpoints that return a list of resources will respond
    to this request and include a header indicating the total number of records
    available. They will not contain the xml body. The server count is specified
    with the `X-Records` header. E.g., for an endpoint with 14 records:


    ```

    X-Records: 14

    ```


    You can pass filtering parameters (described above) to narrow down the
    resources you wish to count. Consider the example of counting all
    `collected` invoices in `2016`. You can send a `HEAD` request to this
    endpoint then parse the count from the X-Records response header:


    ```

    https://your-subdomain.recurly.com/v2/invoices?begin_time=2016-01-01T00:00:00&end_time=2017-01-01T00:00:00&state=collected

    ```

    ##### Examples

    This will return accounts that were created on or before 2016-01-01 0:00 UTC
    in descending order of creation date:

    ```

    https://your-subdomain.recurly.com/v2/accounts?sort=created_at&order=desc&end_time=2016-01-01

    ```


    This will return accounts that were last updated on or after 2016-07-01
    10:30:01 Mountain Daylight Time in ascending order of updated date:


    ```

    https://your-subdomain.recurly.com/v2/accounts?sort=updated_at&order=asc&begin_time=2016-07-01T10:30:01-06:00

    ```


    ###### Beware of changes to records when sorting by updated_at

    <div class="alert alert--warning" markdown="1">

    It's important to be aware that when paging through records sorted by their
    `updated_at` value, the order will change if they are modified:

    * In ascending order, changes to records in previous pages will cause them
    to move back the end of the list, meaning you may see them multiple times.
    This can be avoided by using the time the pagination starts as the
    `end_time`.

    * In descending order, changes to records in later pages will cause them to
    move up to the beginning of the list, meaning you would miss results.

    </div>
