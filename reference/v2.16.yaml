  /subscriptions/{uuid}/preview:
    post:
      summary: Preview Subscription Change
      description: >-
        Returns a preview for a subscription change applied to an account
        without committing a subscription change or posting an invoice.



        ###### Free Trials

        <div class="alert alert--warning" markdown="1">

        Subscriptions in trial will not generate an invoice for an immediate
        change. Due to this, the subscription change preview for a subscription
        in trial will not return an invoice object.

        </div>
            
      tags:
        - subscriptions
      operationId: previewSubscriptionChange
      parameters:
        - in: path
          name: uuid
          schema:
            type: string
            default: ''
          required: true
          description: Subscription's unique identifier.
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              type: object
              properties:
                unit_amount_in_cents:
                  type: integer
                  default: ''
                  description: New unit amount in cents.
                timeframe:
                  type: string
                  default: now
                  description: >-
                    Set as either `now` for immediate, `renewal` to perform when
                    the subscription renews. Defaults to `now`.
                plan_code:
                  type: string
                  default: ''
                  description: New plan, remains unchanged if not specified.
                quantity:
                  type: integer
                  default: ''
                  description: >-
                    New quantity, remains unchanged if not specified and the
                    `plan_code` remains the same.
                collection_method:
                  type: string
                  default: automatic
                  description: >-
                    Optional field to set the collection for an invoice as
                    `automatic` or `manual`. Default is `automatic`.
                subscription_add_ons:
                  type: object
                  default: ''
                  description: >-
                    Nested add-on information for the subscription, the new
                    subscription will have no add-ons unless specified.
                revenue_schedule_type:
                  type: string
                  default: ''
                  description: >-
                    Optional field for setting a revenue schedule type. This
                    will determine how revenue for the associated Subscription
                    should be recognized. When creating a Subscription,
                    available schedule types are `never`, `evenly`,
