                    <currency>EUR</currency>
                    <quantity type="integer">1</quantity>
                    <activated_at type="datetime">2017-03-15T21:20:36Z</activated_at>
                    <canceled_at type="datetime">2017-03-15T21:20:51Z</canceled_at>
