    delete:
      summary: Refund Transaction
      description: >-
        A transaction can refunded if it has settled successfully. It can be
        refunded for any amount equal to or less than the original amount.
        Please note, some payment gateways do not allow the same credit card to
        be partially refunded on the same day as the original purchase. Using
        the transaction refund will not generate a refund invoice. If you need a
        refund invoice, you should use the invoice line item or invoice open
        amount refund.




        <div class="alert alert--danger" markdown="1">

        We are moving to refunds through the Invoice object. Transaction refunds
        will no longer work if you have switched to Invoice Refunds in your Site
        Settings. If you created your site after November 11, 2014, you are
        automatically on Invoice refunds. Please see our API documentation on
        Invoices.

        </div>


        ##### Partial Refunds

        If the transaction has not settled and you attempt a partial refund, the
        request will fail. Please wait until the transaction has settled
        (typically 24 hours) before performing a partial refund. This advice
        varies depending on when your payment gateway settles the transaction.

        <div class="codewrap" markdown="1">

        <div class="codetabs">

        <p class="codetab codetab--php" data-tab="php">PHP</p>

        <p class="codetab codetab--ruby" data-tab="ruby">Ruby</p>

        <p class="codetab codetab--python" data-tab="python">Python</p>

        <p class="codetab codetab--csharp" data-tab="csharp">Dotnet</p>

        </div>


        <div class="codelanguage codelanguage--php" markdown="1">


        ```php

        $transaction =
        Recurly_Transaction::get('a13acd8fe4294916b79aec87b7ea441f');

        $transaction->refund(1000); // Refund $10.00.

        ```


        </div><div class="codelanguage codelanguage--ruby" markdown="1">


        ```ruby

        transaction =
        Recurly::Transaction.find('a13acd8fe4294916b79aec87b7ea441f')

        transaction.refund(10_00)

        ```


        </div><div class="codelanguage codelanguage--python" markdown="1">


        ```python

        transaction = Transaction.get('a13acd8fe4294916b79aec87b7ea441f')

        transaction.refund(amount_in_cents=1000)

        ```


        </div><div class="codelanguage codelanguage--csharp" markdown="1">


        ```csharp

        var transaction = Transactions.Get("a13acd8fe4294916b79aec87b7ea441f");

        transaction.Refund(1000); // (in cents) Refund $10

        ```


        </div>
              </div>

        ##### Full Refunds

        If the transaction has not settled and you perform a full refund, the
        transaction will be voided instead. Voided transactions typically do not
        show up on the customer's card statement. If the transaction has
        settled, a refund will be performed.

        <div class="codewrap" markdown="1">

        <div class="codetabs">

        <p class="codetab codetab--php" data-tab="php">PHP</p>

        <p class="codetab codetab--ruby" data-tab="ruby">Ruby</p>

        <p class="codetab codetab--python" data-tab="python">Python</p>

        <p class="codetab codetab--csharp" data-tab="csharp">Dotnet</p>

        </div>


        <div class="codelanguage codelanguage--php" markdown="1">


        ```php

        $transaction =
        Recurly_Transaction::get('a13acd8fe4294916b79aec87b7ea441f');

        $transaction->refund();

        ```


        </div><div class="codelanguage codelanguage--ruby" markdown="1">


        ```ruby

        transaction =
        Recurly::Transaction.find('a13acd8fe4294916b79aec87b7ea441f')

        transaction.refund()

        ```


        </div><div class="codelanguage codelanguage--python" markdown="1">


        ```python

        transaction = Transaction.get('a13acd8fe4294916b79aec87b7ea441f')

        transaction.refund()

        ```


        </div><div class="codelanguage codelanguage--csharp" markdown="1">


        ```csharp

        var transaction = Transactions.Get("a13acd8fe4294916b79aec87b7ea441f");

        transaction.Refund();

        ```


        </div>
              </div>
      tags:
        - transactions
      operationId: refundTransaction
      parameters:
        - in: path
          name: uuid
